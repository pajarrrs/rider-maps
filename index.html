<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riders — Rute Terpendek</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <button id="map-satellite-btn" class="map-ctrl-sat" title="Mode Satelit" aria-label="Mode Satelit">
    <span>🛰️</span>
  </button>

  <aside id="panel">
    <div class="panel-handle" id="panel-handle" title="Tarik atau ketuk untuk sembunyikan"></div>
    <header id="panel-header">
      <div class="header-title">
        <h1>Riders</h1>
        <span class="sub">Rute terpendek</span>
      </div>
      <button id="panel-toggle" class="panel-toggle-btn" title="Sembunyikan panel" aria-label="Sembunyikan panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
        <span class="toggle-text">Sembunyikan</span>
      </button>
    </header>

    <div class="field">
      <span class="dot start"></span>
      <input id="from" placeholder="Dari mana? (atau klik peta)" autocomplete="off">
      <button class="icon" id="myloc" title="Pakai lokasi saya">◎</button>
      <ul class="suggest" id="from-suggest"></ul>
    </div>
    <button class="icon swap" id="swap" title="Tukar asal & tujuan">⇅</button>
    <div class="field">
      <span class="dot end"></span>
      <input id="to" placeholder="Ke mana?" autocomplete="off">
      <ul class="suggest" id="to-suggest"></ul>
    </div>

    <div class="row">
      <select id="mode">
        <option value="motorcycle">Motor</option>
        <option value="car">Mobil</option>
        <option value="bike">Sepeda</option>
        <option value="foot">Jalan kaki</option>
      </select>
      <select id="optimize">
        <option value="distance">Jarak terpendek</option>
        <option value="duration">Waktu tercepat</option>
      </select>
    </div>

    <button id="go" class="primary">Cari Rute</button>
    <div id="status"></div>
    <div id="results"></div>

    <details id="settings">
      <summary>Pengaturan &amp; Lalu lintas</summary>
      <label class="check"><input type="checkbox" id="toggleSatellite"> Mode Satelit (Hybrid)</label>
      <label class="check"><input type="checkbox" id="toggle3d"> Mode 3D (gedung)</label>
      <label class="check"><input type="checkbox" id="toggleTraffic"> Layer kemacetan di peta</label>
      <label class="check"><input type="checkbox" id="simulate"> Simulasi perjalanan (tes tanpa GPS)</label>
    </details>
  </aside>
  <button id="panel-reopen" class="panel-reopen-btn hidden" title="Tampilkan menu dan rute">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
      <circle cx="12" cy="10" r="3"></circle>
    </svg>
    <span id="reopen-label">Buka Menu / Rute</span>
  </button>

  <div id="nav-top" class="nav-ui">
    <div id="nav-icon">↑</div>
    <div class="nav-text">
      <div id="nav-dist"></div>
      <div id="nav-instr">Mencari sinyal GPS…</div>
    </div>
  </div>
  <button id="nav-recenter" class="nav-ui hidden">◎ Pusatkan</button>
  <div id="nav-bottom" class="nav-ui">
    <div class="nav-stats">
      <b id="nav-eta"></b>
      <span id="nav-remain"></span>
    </div>
    <button id="nav-voice" class="icon" title="Suara">🔊</button>
    <button id="nav-stop" class="danger">Akhiri</button>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
